<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  :root {
    --a1: 245, 158, 11; --r1: .24;
    --a2: 56, 189, 248; --r2: .13;
    --grid: 255, 200, 120;
    --frame-border: rgba(253, 186, 116, .2);
    --bracket: rgba(251, 191, 36, .85);
    --glow1: 251, 191, 36; --glow2: 34, 211, 238;
    --accent-ink: #fcd34d; --accent-line: #fbbf24;
    --h1-end: #fde68a; --h1-glow: rgba(251, 191, 36, .45);
    --span-1: #fde68a; --span-2: #d97706;
    --sub-ink: #f3ddb4;
    --chip-border: rgba(253, 186, 116, .4); --chip-ink: #fef3c7; --chip-bg: 120, 53, 15;
    --foot-ink: #fcd34d;
    --panel-border: rgba(253, 186, 116, .5);
    --panel-glow: rgba(251, 191, 36, .2);
    --bar-border: rgba(253, 186, 116, .26);
    --stage-glow: rgba(251, 191, 36, .45);
    --ring-color: rgba(251, 191, 36, .35);
    --title-size: 60px; --title-ls: .02em;
    --span-size: 34px; --span-ls: .14em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="glowline top"></div>
  <div class="glowline bottom"></div>
  <div class="content">
    <div class="left">
      <div class="eyebrow">PROJECT 03 // MOBILE APP</div>
      <h1>W-GYM<span>WORKOUT TRACKER</span></h1>
      <div class="sub">OFFLINE-FIRST WORKOUT LOGGING &#183; HIVE + FIRESTORE</div>
      <div class="chips">
        <div class="chip">Flutter</div>
        <div class="chip">Firebase</div>
        <div class="chip">Hive</div>
      </div>
      <div class="foot">github.com/nandhitooo/wgym-app</div>
    </div>
    <div class="panel">
      <div class="bar">
        <div class="dot" style="background:#ef4444"></div>
        <div class="dot" style="background:#f59e0b"></div>
        <div class="dot" style="background:#22c55e"></div>
      </div>
      <div class="ring"></div>
      <div class="stage">
        <img src="images/wgym-logo.jpg" alt="" />
      </div>
    </div>
  </div>
  <div class="scan"></div>
</body>
</html>
