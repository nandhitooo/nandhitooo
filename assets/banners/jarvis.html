<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  :root {
    --a1: 34, 211, 238; --r1: .24;
    --a2: 59, 130, 246; --r2: .16;
    --grid: 120, 240, 255;
    --frame-border: rgba(125, 235, 252, .22);
    --bracket: rgba(34, 211, 238, .9);
    --glow1: 34, 211, 238; --glow2: 96, 165, 250;
    --accent-ink: #67e8f9; --accent-line: #22d3ee;
    --h1-end: #a5f3fc; --h1-glow: rgba(34, 211, 238, .55);
    --span-1: #a5f3fc; --span-2: #0891b2;
    --sub-ink: #b8e6f2;
    --chip-border: rgba(125, 235, 252, .42); --chip-ink: #cffafe; --chip-bg: 14, 116, 144;
    --foot-ink: #67e8f9;
    --panel-border: rgba(125, 235, 252, .55);
    --panel-glow: rgba(34, 211, 238, .25);
    --bar-border: rgba(125, 235, 252, .28);
    --title-size: 66px; --title-ls: .04em;
    --span-size: 34px; --span-ls: .22em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="glowline top"></div>
  <div class="glowline bottom"></div>
  <div class="content">
    <div class="left">
      <div class="eyebrow">PROJECT 04 // DISCORD BOT</div>
      <h1>JARVIS<span>DISCORD BOT</span></h1>
      <div class="sub">AI CHAT &#183; IMAGE GEN &#183; MODERATION &#183; MUSIC</div>
      <div class="chips">
        <div class="chip">Rust</div>
        <div class="chip">Serenity</div>
        <div class="chip">Songbird</div>
        <div class="chip">Groq</div>
      </div>
      <div class="foot">github.com/nandhitooo/jarvis-rust</div>
    </div>
    <div class="panel">
      <img class="cover" src="images/jarvis-panel.jpg" alt="" />
      <div class="bar">
        <div class="dot" style="background:#ef4444"></div>
        <div class="dot" style="background:#f59e0b"></div>
        <div class="dot" style="background:#22c55e"></div>
      </div>
    </div>
  </div>
  <div class="scan"></div>
</body>
</html>
