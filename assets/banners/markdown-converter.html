<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  :root {
    --a1: 139, 92, 246; --r1: .28;
    --a2: 56, 189, 248; --r2: .16;
    --grid: 120, 200, 255;
    --frame-border: rgba(125, 211, 252, .22);
    --bracket: rgba(34, 211, 238, .85);
    --glow1: 34, 211, 238; --glow2: 167, 139, 250;
    --accent-ink: #67e8f9; --accent-line: #22d3ee;
    --h1-end: #93c5fd; --h1-glow: rgba(96, 165, 250, .55);
    --span-1: #c4b5fd; --span-2: #7c3aed;
    --sub-ink: #b6d7ea;
    --chip-border: rgba(125, 211, 252, .4); --chip-ink: #bae6fd; --chip-bg: 14, 116, 144;
    --foot-ink: #7dd3fc;
    --panel-border: rgba(125, 211, 252, .55);
    --panel-glow: rgba(56, 189, 248, .22);
    --bar-border: rgba(125, 211, 252, .28);
    --title-size: 62px; --title-ls: .02em;
    --span-size: 34px; --span-ls: .16em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="glowline top"></div>
  <div class="glowline bottom"></div>
  <div class="content">
    <div class="left">
      <div class="eyebrow">PROJECT 01 // WEB APP</div>
      <h1>MARKDOWN<span>CONVERTER</span></h1>
      <div class="sub">DOCX / PDF &#8646; MARKDOWN — 100% IN YOUR BROWSER</div>
      <div class="chips">
        <div class="chip">React 19</div>
        <div class="chip">Vite</div>
        <div class="chip">PDF.js</div>
        <div class="chip">Mermaid</div>
      </div>
      <div class="foot">github.com/nandhitooo/markdown-converter-web</div>
    </div>
    <div class="panel">
      <img class="shot" src="images/markdown-converter.png" alt="" />
      <div class="bar">
        <div class="dot" style="background:#ef4444"></div>
        <div class="dot" style="background:#f59e0b"></div>
        <div class="dot" style="background:#22c55e"></div>
      </div>
    </div>
  </div>
  <div class="scan"></div>
</body>
</html>
