<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  :root {
    --a1: 34, 197, 94; --r1: .26;
    --a2: 56, 189, 248; --r2: .14;
    --grid: 120, 255, 190;
    --frame-border: rgba(125, 252, 180, .22);
    --bracket: rgba(74, 222, 128, .9);
    --glow1: 74, 222, 128; --glow2: 34, 211, 238;
    --accent-ink: #86efac; --accent-line: #4ade80;
    --h1-end: #bbf7d0; --h1-glow: rgba(74, 222, 128, .45);
    --span-1: #bbf7d0; --span-2: #16a34a;
    --sub-ink: #b9e6cd;
    --chip-border: rgba(134, 239, 172, .4); --chip-ink: #d9fbe5; --chip-bg: 20, 83, 45;
    --foot-ink: #86efac;
    --panel-border: rgba(134, 239, 172, .55);
    --panel-glow: rgba(74, 222, 128, .2);
    --bar-border: rgba(134, 239, 172, .28);
    --title-size: 60px; --title-ls: .02em;
    --span-size: 36px; --span-ls: .2em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="glowline top"></div>
  <div class="glowline bottom"></div>
  <div class="content">
    <div class="left">
      <div class="eyebrow">PROJECT 02 // FINAL PROJECT</div>
      <h1>BUMDESMA<span>ABSENSI</span></h1>
      <div class="sub">QR-CODE BASED EMPLOYEE ATTENDANCE SYSTEM</div>
      <div class="chips">
        <div class="chip">React 19</div>
        <div class="chip">Express</div>
        <div class="chip">PostgreSQL</div>
        <div class="chip">Flutter</div>
      </div>
      <div class="foot">github.com/nandhitooo/bumdesma-absensi</div>
    </div>
    <div class="panel">
      <img class="shot" src="images/absensi-dashboard.png" alt="" />
      <div class="bar">
        <div class="dot" style="background:#ef4444"></div>
        <div class="dot" style="background:#f59e0b"></div>
        <div class="dot" style="background:#22c55e"></div>
      </div>
    </div>
  </div>
  <div class="scan"></div>
</body>
</html>
